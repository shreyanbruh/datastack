[project]
site_name = "DataStack"
site_description = "GitHub guides and resources for the team"

nav = [
  { "GitHub Tutorial" = "index.md" },
  { "Jupyter Notebook Conversion" = "jupyter-notebook-conversion.md" },
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.top",
]

[project.theme.font]
text = "Helvetica Neue"
code = "JetBrains Mono"

# ---------------------------------------------------------------------------
# Header logos + background image.
# Drop your files in docs/assets/images/ using these exact names (or change
# the paths below), then rebuild. See docs/assets/images/README.md for the
# recommended pixel dimensions for each one.
# ---------------------------------------------------------------------------
[project.extra]
logo_left = "assets/images/logo-left.png"
logo_right = "assets/images/logo-right.png"
header_background = "assets/images/header-bg.jpg"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
